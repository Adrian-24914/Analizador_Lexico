<!-- index.html -->

<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
        />
        <title>Regex a AFN</title>
    </head>

    <body>
        <main class="container">
        <h1>Conversión de expresión regular a AFN</h1>

        <section aria-labelledby="file-results-title">
            <h2 id="file-results-title">Resultados de los archivos</h2>
            <p>Cada resultado relaciona las líneas equivalentes de ambos archivos.</p>
            <div id="file-results" class="file-results"></div>
        </section>

        <hr />

        <h2>Prueba manual</h2>

        <form id="regex-form">
            <label for="regex-input">
            Expresión regular
            </label>

            <div class="controls">
            <input
                id="regex-input"
                value="a(b|c)*"
                autocomplete="off"
            />

            <button type="submit">
                Convertir
            </button>
            </div>
        </form>

        <section class="result">
            <p>
            Concatenación explícita:
            <code id="formatted-output"></code>
            </p>

            <p>
            Expresión postfija:
            <code id="postfix-output"></code>
            </p>

            <p id="error-output" role="alert"></p>
        </section>

        <h3>AFN (Thompson)</h3>
        <div id="nfa-container" class="nfa-graph" role="img" aria-label="AFN de la expresión regular"></div>

        <h3>AFD (construcción por subconjuntos)</h3>
        <div id="dfa-container"></div>
        <div id="dfa-legend"></div>
        </main>

        <script type="module" src="/main.ts"></script>
    </body>
</html>
