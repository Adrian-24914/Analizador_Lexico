<!-- index.html -->

<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
        />
        <title>Regex a AFN</title>
    </head>

    <body>
        <main class="container">
        <h1>Conversión de expresión regular a AFN</h1>

        <nav class="view-switcher" aria-label="Vistas principales">
            <button id="manual-view-button" type="button" aria-controls="manual-view" aria-pressed="true">
                Expresión infix
            </button>
            <button id="file-view-button" type="button" aria-controls="file-view" aria-pressed="false">
                Autómatas de regex.txt
            </button>
        </nav>

        <section id="manual-view" aria-labelledby="manual-view-title">
        <h2 id="manual-view-title">Ingresar expresión regular</h2>

        <form id="regex-form">
            <label for="regex-input">
            Expresión regular
            </label>

            <div class="controls">
            <input
                id="regex-input"
                value="a(b|c)*"
                autocomplete="off"
            />

            <button type="submit">
                Convertir
            </button>
            </div>
        </form>

        <section class="result">
            <p>
            Concatenación explícita:
            <code id="formatted-output"></code>
            </p>

            <p>
            Expresión postfija:
            <code id="postfix-output"></code>
            </p>

            <p id="error-output" role="alert"></p>
        </section>

        <h3>AFN (Thompson)</h3>
        <div id="nfa-container" class="nfa-graph" role="img" aria-label="AFN de la expresión regular"></div>

        <h3>AFD (construcción por subconjuntos)</h3>
        <div id="dfa-container" class="dfa-graph" role="img" aria-label="AFD de la expresión regular"></div>

        <h3>AFD minimizado</h3>
        <div id="minimized-dfa-container" class="dfa-graph" role="img" aria-label="AFD minimizado de la expresión regular"></div>
        </section>

        <section id="file-view" aria-labelledby="file-view-title" hidden>
            <h2 id="file-view-title">Autómatas de regex.txt</h2>
            <p>Se muestran los autómatas generados por cada línea de regex.txt.</p>
            <div id="file-results" class="file-results"></div>
        </section>
        </main>

        <script type="module" src="/main.ts"></script>
    </body>
</html>
